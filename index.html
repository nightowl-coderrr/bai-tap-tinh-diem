<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tính điểm trung bình sinh viên</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Tính điểm trung bình &amp; xếp loại</h1>

    <form id="scoreForm" novalidate>
      <div class="field">
        <label for="studentName">Tên sinh viên</label>
        <input type="text" id="studentName" placeholder="Nhập họ và tên">
        <span class="error" id="error-studentName"></span>
      </div>

      <div class="field">
        <label for="score1">Giải tích 1</label>
        <input type="number" id="score1" min="0" max="10" step="0.01" placeholder="0 - 10">
        <span class="error" id="error-score1"></span>
      </div>

      <div class="field">
        <label for="score2">Đại số tuyến tính</label>
        <input type="number" id="score2" min="0" max="10" step="0.01" placeholder="0 - 10">
        <span class="error" id="error-score2"></span>
      </div>

      <div class="field">
        <label for="score3">Xác suất thống kê</label>
        <input type="number" id="score3" min="0" max="10" step="0.01" placeholder="0 - 10">
        <span class="error" id="error-score3"></span>
      </div>

      <div class="field">
        <label for="score4">Tin học đại cương</label>
        <input type="number" id="score4" min="0" max="10" step="0.01" placeholder="0 - 10">
        <span class="error" id="error-score4"></span>
      </div>

      <div class="field">
        <label for="score5">Xây dựng ứng dụng Web</label>
        <input type="number" id="score5" min="0" max="10" step="0.01" placeholder="0 - 10">
        <span class="error" id="error-score5"></span>
      </div>

      <button type="submit">Tính kết quả</button>
    </form>

    <section id="result" class="result hidden" aria-live="polite">
      <h2>Kết quả</h2>
      <p>Sinh viên: <strong id="resName"></strong></p>
      <table>
        <thead>
          <tr><th>STT</th><th>Môn học</th><th>Điểm</th></tr>
        </thead>
        <tbody id="resBody"></tbody>
        <tfoot>
          <tr><td colspan="2">Điểm trung bình</td><td id="resAvg"></td></tr>
          <tr><td colspan="2">Xếp loại học tập</td><td id="resRank"></td></tr>
        </tfoot>
      </table>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
